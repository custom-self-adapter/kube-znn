apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-znn-db
  labels:
    app: kube-znn-db
spec:
  selector:
    matchLabels:
      app: kube-znn-db
  template:
    metadata:
      labels:
        app: kube-znn-db
    spec:
      nodeSelector:
        workload: db
      volumes:
      - name: init-db-config
        configMap:
          name: init-db-config
      containers:
      - image: mysql:5.6
        name: mysql
        volumeMounts:
        - name: init-db-config
          mountPath: /docker-entrypoint-initdb.d
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "znn_pass"
        livenessProbe:
          tcpSocket:
            port: 3306
        ports:
        - containerPort: 3306
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1500m"
            memory: "2048Mi"
          

