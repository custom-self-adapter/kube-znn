apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- files:
  - init-db.sql
  name: init-db-config
- files:
  - nginx.conf
  - prometheus.lua
  - prometheus_keys.lua
  - prometheus_resty_counter.lua
  name: nginx-config
resources:
- db-deployment.yaml
- db-service.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
